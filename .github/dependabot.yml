# See https://docs.github.com/en/github/administering-a-repository/configuration-options-for-dependency-updates#package-ecosystem
# No npm entry: the versions in tools/dev/node are parity pins (the tools the golden data was
# built with), not dependencies to keep current. No entry for docs/ either: its go.mod and
# package.json belong to the docs site, whose files the test fixtures record by hash.
version: 2
updates:
  # One grouped pull request for the patch bumps and one for the minor bumps, so that a minor
  # bump of a 0.x crate (a breaking change for Cargo: comrak 0.55 to 0.56, tera-contrib,
  # ...) does not hold back the patch and security fixes. Several crates shape the output the
  # parity gates compare with the Go build's golden data (comrak, minify-html,
  # lightningcss, oxc, grass, image, webp, ...): each group must pass the gates of CI's Test job
  # like any change, and a bump that changes a gate's differences needs an entry in
  # tools/dev/changes/ (see its README).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      patch:
        patterns: ["*"]
        update-types: ["patch"]
      minor:
        patterns: ["*"]
        update-types: ["minor"]
    ignore:
      # Pinned exactly ("=2.4.0" in Cargo.toml) on purpose, a young engine whose behaviour the
      # layouts rely on (docs/rust-port/REWRITE_PLAN.md §9, risk 3): moved by hand.
      - dependency-name: "tera"
      # Versions that follow other crates' rather than the latest release: a new major, or a new
      # 0.x minor (a breaking change for Cargo), adds a second copy beside the one the graph uses
      # instead of moving it. The 0.x crates of the "workspace-hack only" block of Cargo.toml
      # (the versions the graph uses, with the union of their features: DEVELOPMENT.md,
      # "Feature unification"), the oxc crates minify-html locks, and the crates Cargo.toml
      # locks through another: tungstenite (axum's), emojis (comrak's), browserslist-rs
      # (lightningcss's), similar (insta's). Moved by hand.
      - { dependency-name: "allocator-api2", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "getrandom", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "hashbrown", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "itertools", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "libc", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "litemap", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "log", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "num-traits", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "potential_utf", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "regex-automata", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "regex-syntax", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "simd-adler32", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "tinystr", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "writeable", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "yoke", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "zerocopy", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "zerofrom", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "zerotrie", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "zerovec", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "oxc_*", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "tungstenite", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "emojis", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "browserslist-rs", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "similar", update-types: ["version-update:semver-major"] }

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # One pull request for every action update, majors included: workflow files are merged by
    # hand (automerge.yml's token cannot change them).
    groups:
      actions:
        patterns: ["*"]
