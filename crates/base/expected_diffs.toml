# Reviewed differences from the Go oracles (REWRITE_PLAN.md §6.3). Read by tests/it.

# gobwas/glob (the Go implementation's glob library) mis-matches these patterns of
# testdata/oracle/common/glob/match.json.gz; ssg-base implements the documented glob semantics
# instead (crate README, "Accepted deviations"). Each entry: pattern, then one input where gobwas
# answers wrongly.
[glob]
# An empty alternative group (`{}`, `{,}`, a trailing `{`) makes gobwas match nothing.
empty = [
    ["**[ab]**{a*,b?}{", "ba"],  # gobwas: false
    [",{", ","],  # gobwas: false
    ["[!a-c]a{", "/a"],  # gobwas: false
    ["[!ab]{a,}{", "c"],  # gobwas: false
    ["[!ab]{}/.", "*/."],  # gobwas: false
    ["[[!a-c]{{", "a"],  # gobwas: false
    ["[a-c]**{", "a"],  # gobwas: false
    ["]**{", "]"],  # gobwas: false
    ["a{,}", "a"],  # gobwas: false
    ["{,}a", "a"],  # gobwas: false
    ["{a,ab}[/]{", "a/"],  # gobwas: false
    ["{a,b}{}", "a"],  # gobwas: false
    ["{a,}*{", ""],  # gobwas: false
    ["ก{", "ก"],  # gobwas: false
]
# Alternatives of different shapes (`{a*,b?}`) next to other wildcards are mis-compiled.
shapes = [
