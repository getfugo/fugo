[package]
name = "ssg-dev"
description = "The repository's tools: test sites, build manifests, structdiff, licence checks and release archives"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false
test = false # tests live only in tests/it

[[bin]]
name = "ssg-dev"
path = "src/main.rs"
test = false
doctest = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dependencies]
ssg-workspace-hack.workspace = true
ssg-base.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
indexmap.workspace = true
regex.workspace = true
html5gum.workspace = true
quick-xml.workspace = true
url.workspace = true
percent-encoding.workspace = true
unicode-normalization.workspace = true
image.workspace = true
similar.workspace = true
globset.workspace = true
flate2.workspace = true
tar.workspace = true
zip.workspace = true
sha2.workspace = true
spdx.workspace = true
semver.workspace = true
jiff.workspace = true
filetime.workspace = true
walkdir.workspace = true
tempfile.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
