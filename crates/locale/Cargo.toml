[package]
name = "ssg-locale"
description = "ICU4X collation and plural rules, i18n bundles with the restricted {{ .Field }} message evaluator, number formatting and localized dates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
doctest = false
test = false # every test is in tests/it (one binary links the ICU data)

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dependencies]
ssg-workspace-hack.workspace = true
ssg-base.workspace = true
icu_collator.workspace = true
icu_plurals.workspace = true
icu_decimal.workspace = true
icu_locale_core.workspace = true
icu_datetime.workspace = true
jiff.workspace = true
writeable.workspace = true
thiserror.workspace = true

[dev-dependencies]
ssg-testkit.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex.workspace = true
pretty_assertions.workspace = true
