{%- set aliases = page.params.functions_and_methods?.aliases %}
{%- if aliases %}
  {%- set label = "Aliases" if aliases | length > 1 else "Alias" %}
  <p class="font-bold text-dark dark:text-light mt-2">{{ label }}</p>
  {%- for alias in aliases %}
    <div class="font-sm font-mono ml-3 sm:ml-6 mt-0 sm:mt-1">
      {{- alias -}}
    </div>
  {%- endfor %}
{%- endif -%}
